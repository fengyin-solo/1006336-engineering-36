server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 纯前端应用：路由走 history 模式，找不到文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
